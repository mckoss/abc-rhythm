<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>abc-rhythm</title>
  <link rel="stylesheet" href="style.css?v=0.9">
  <!-- abcjs for score rendering -->
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.3/dist/abcjs-basic-min.js"></script>
</head>
<body>

<header>
  <h1>abc-rhythm <span class="app-version">v0.9</span></h1>
  <p>Hold Shift (or tap) in time to a click track — annotate note durations live.</p>
</header>

<div class="app">

  <!-- ── Left sidebar ── -->
  <aside class="sidebar">

    <!-- Settings -->
    <div class="section">
      <div class="section-title">Settings</div>
      <div class="settings-grid">

        <div class="field">
          <label>Time Signature</label>
          <div class="derived-value" id="time-sig-display">—</div>
          <span class="derived-note">from M: in ABC</span>
        </div>

        <div class="field">
          <label>Resolution</label>
          <select id="resolution">
            <option value="quarter">Quarter notes</option>
            <option value="eighth" selected>Eighth notes</option>
            <option value="sixteenth">Sixteenth notes</option>
            <option value="thirty-second">32nd notes</option>
          </select>
        </div>

        <div class="field" style="grid-column: 1 / -1">
          <label>Tempo — <span id="bpm-label">—</span> BPM
            <span class="derived-note" id="bpm-source"></span>
          </label>
          <input type="range" id="bpm-slider" min="40" max="240" value="100" step="1" disabled>
        </div>

        <div class="field">
          <label>Count-in</label>
          <select id="count-in">
            <option value="0">None</option>
            <option value="1" selected>1 measure</option>
            <option value="2">2 measures</option>
          </select>
        </div>

      </div>
    </div>

    <!-- ABC input -->
    <div class="abc-input-wrap">
      <div class="section-title" style="padding: 0 0 0.5rem">ABC Notation Input</div>
      <textarea id="input-abc" spellcheck="false"
        placeholder="Paste ABC here — notes without durations are fine:&#10;&#10;X:1&#10;T:My Tune&#10;M:4/4&#10;L:1/4&#10;K:C&#10;CDEC CDEC EFGE EFGz|"
      ></textarea>
      <div class="input-actions">
        <button class="btn-primary" id="load-btn">Load</button>
        <button class="btn-secondary" id="example-btn">Example</button>
        <button class="btn-secondary" id="clear-btn" disabled>Clear</button>
      </div>
    </div>

  </aside>

  <!-- ── Main area ── -->
  <div class="main-area">

    <!-- Transport bar -->
    <div class="transport">
      <div class="transport-btns">
        <button class="btn-primary" id="start-btn" disabled>▶ Start</button>
        <button class="btn-secondary" id="play-score-btn" disabled>▶ Play Score</button>
        <button class="btn-danger"  id="stop-btn"  disabled>■ Stop</button>
        <button class="btn-secondary" id="redo-btn" disabled>↺ Redo</button>
      </div>
      <div class="beat-display" id="beat-display"></div>
      <div class="transport-status" id="transport-status">Load ABC to begin.</div>
      <button class="btn-secondary" id="copy-btn" disabled>Copy ABC</button>
    </div>

    <!-- Note sequence strip -->
    <div class="note-strip-wrap">
      <div class="note-strip" id="note-strip">
        <span style="color:var(--muted);font-size:0.8rem">Notes appear here after loading.</span>
      </div>
    </div>

    <!-- TAP button -->
    <div class="tap-area">
      <button class="tap-btn" id="tap-btn" disabled>SHIFT  /  TAP</button>
    </div>

    <!-- Score + output -->
    <div class="score-area">
      <div class="score-tabs">
        <button class="score-tab active" data-tab="score">Score</button>
        <button class="score-tab" data-tab="abc">ABC Output</button>
      </div>
      <div id="score-container"></div>
      <div class="output-abc-wrap" id="abc-output-panel" style="display:none">
        <textarea id="output-abc" readonly spellcheck="false"
          placeholder="Annotated ABC will appear here after recording."></textarea>
      </div>
    </div>

  </div><!-- /main-area -->
</div><!-- /app -->

<!-- Modules (load order matters) -->
<script src="music-state.js?v=0.9"></script>
<script src="click-track.js?v=0.9"></script>
<script src="note-player.js?v=0.9"></script>
<script src="quantize.js?v=0.9"></script>
<script src="renderer.js?v=0.9"></script>
<script src="abc-rhythm.js?v=0.9"></script>
</body>
</html>
